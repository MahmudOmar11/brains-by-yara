<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تم الإرسال — Brains by Yara</title>
    <link rel="icon" type="image/png" href="Yara_logo_Sand.png">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --brown:#640D15; --cream:#F5EAE0; --off-white:#ECEDE6; --near-black:#2f2326; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Tajawal',sans-serif; background:var(--off-white); color:var(--near-black); min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:2rem; }
        .success-icon { font-size:4rem; margin-bottom:1.5rem; }
        h1 { font-size:2rem; font-weight:800; color:var(--brown); margin-bottom:0.8rem; }
        p { font-size:1.1rem; color:rgba(47,35,38,0.7); margin-bottom:2rem; max-width:400px; }
        a { display:inline-block; padding:0.9rem 2.5rem; background:var(--brown); color:var(--cream); text-decoration:none; border-radius:100px; font-weight:700; font-size:0.95rem; transition:all 0.3s; }
        a:hover { transform:translateY(-2px); box-shadow:0 16px 32px rgba(100,13,21,0.2); }
    </style>
</head>
<body>
    <div class="success-icon">✓</div>
    <h1>تم إرسال طلبكم بنجاح</h1>
    <p>شكرًا لتواصلكم! سنتواصل معكم في أقرب وقت لمناقشة التفاصيل وإرسال عرض سعر</p>
    <a href="/">العودة للصفحة الرئيسية</a>
</body>
</html>
